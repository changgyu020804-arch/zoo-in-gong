<!DOCTYPE html>
<html lang="ko">
{% set page_title = '제작소 | Zoo-In-Gong' %}
{% include 'partials/head.html' %}
<body data-page="studio">
    <div class="app-shell studio-shell">
        <main class="content-column studio-column">
            {% set topbar_action = none %}
            {% set topbar_href = url_for('profile') %}
            {% set topbar_icon = 'fa-regular fa-circle-user' %}
            {% set topbar_label = '프로필' %}
            {% include 'partials/mobile_topbar.html' %}

            <section class="studio-board">
                <div class="studio-canvas-panel">
                    <div class="section-head">
                        <div>
                            <p class="eyebrow">제작소</p>
                            <h1>댕댕 이모티콘</h1>
                        </div>
                        <div class="studio-action-row">
                            <label class="ghost-button studio-file-button" for="studio-file-input">
                                <i class="fa-regular fa-image"></i>
                                사진 선택
                            </label>
                            <button type="button" class="primary-button js-studio-download">
                                <i class="fa-solid fa-download"></i>
                                PNG 저장
                            </button>
                        </div>
                    </div>
                    <input type="file" id="studio-file-input" accept="image/*">
                    <img id="studio-speech-bubble-asset" src="{{ url_for('static', filename='images/studio-speech-bubble.png') }}" alt="" hidden>
                    <img id="studio-crown-sticker-asset" src="{{ url_for('static', filename='images/studio-crown-sticker.png') }}" alt="" hidden>
                    <img id="studio-heart-sticker-asset" src="{{ url_for('static', filename='images/studio-heart-sticker.png') }}" alt="" hidden>
                    <img id="studio-flower-sticker-asset" src="{{ url_for('static', filename='images/studio-flower-sticker.png') }}" alt="" hidden>
                    <img id="studio-glasses-sticker-asset" src="{{ url_for('static', filename='images/studio-glasses-sticker.png') }}" alt="" hidden>
                    <img id="studio-star-sticker-asset" src="{{ url_for('static', filename='images/studio-star-sticker.png') }}" alt="" hidden>
                    <img id="studio-bone-sticker-asset" src="{{ url_for('static', filename='images/studio-bone-sticker.png') }}" alt="" hidden>
                    <div class="studio-canvas-frame">
                        <canvas id="studio-canvas" width="720" height="720" aria-label="이모티콘 미리보기"></canvas>
                    </div>
                </div>

            </section>
        </main>
    </div>

    <nav class="mobile-nav">
        <a class="mobile-nav-button" href="{{ url_for('index') }}"><i class="fa-solid fa-house"></i></a>
        <a class="mobile-nav-button" href="{{ url_for('profile') }}"><i class="fa-regular fa-circle-user"></i></a>
        <a class="mobile-nav-button" href="{{ url_for('friends') }}"><i class="fa-solid fa-user-group"></i></a>
        <a class="mobile-nav-button is-active" href="{{ url_for('studio') }}"><i class="fa-solid fa-wand-magic-sparkles"></i></a>
    </nav>

    <script>
        window.APP_BOOTSTRAP = {{ bootstrap | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}?v=studio-maker-20260622a"></script>
</body>
</html>
